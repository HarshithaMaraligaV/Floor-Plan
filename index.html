    * {

      padding: 0;

      background-color: #f3f4f6;
      color: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* A4/Letter Sheet Container */
    .sheet {
      background: #ffffff;
      width: 100%;
      max-width: 1050px;
      aspect-ratio: 1100 / 980;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 12px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    svg text {
      font-family: 'Crimson Pro', Georgia, serif;
    }

    /* Clean Print / PDF Export Rules */
    @page {
      size: A4 landscape;
      margin: 8mm;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
        min-height: auto;
      }

      .toolbar {
        display: none !important;
      }

      .sheet {
        box-shadow: none;
        max-width: 100%;
        width: 100%;
        height: 96vh;
        padding: 0;
      }
    }
  </style>
</head>
